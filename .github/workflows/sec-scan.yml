name: sec-scan
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "0 9 * * 1"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: sec-scan-${{ github.ref }}
  cancel-in-progress: true
jobs:
  sec-scan:
    uses: adapta-school/github-actions-workflows/.github/workflows/sec-scan.yml@064be6fefbd13e33be2d29f8fa2763287f8a3d05
